
<template>
    <div class="expense-page">
        <header class="page-header">
            <div>
                <p class="eyebrow">TRAVELEASY</p>
                <h1>Expense Reports</h1>
                <p class="page-subtitle">
                    Create reports, track expenses, and monitor reimbursements.
                </p>
            </div>
            <div class="header-actions">
                <lightning-button
                    label="Refresh"
                    icon-name="utility:refresh"
                    onclick={handleRefresh}
                    disabled={isLoading}>
                </lightning-button>
                <lightning-button
                    label="Create Expense Report"
                    variant="brand"
                    icon-name="utility:add"
                    onclick={handleOpenReportForm}>
                </lightning-button>
            </div>
        </header>

        <template lwc:if={errorMessage}>
            <div class="error-banner" role="alert">
                <lightning-icon icon-name="utility:error" size="small">
                </lightning-icon>
                <span>{errorMessage}</span>
                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Dismiss"
                    onclick={handleDismissError}>
                </lightning-button-icon>
            </div>
        </template>

        <section class="summary-grid">
            <article class="summary-card">
                <span class="summary-icon total-icon">
                    <lightning-icon icon-name="utility:receipt" size="small">
                    </lightning-icon>
                </span>
                <div>
                    <p class="summary-label">Total Reports</p>
                    <h2>{totalReports}</h2>
                </div>
            </article>
            <article class="summary-card">
                <span class="summary-icon pending-icon">
                    <lightning-icon icon-name="utility:clock" size="small">
                    </lightning-icon>
                </span>
                <div>
                    <p class="summary-label">Pending Review</p>
                    <h2>{pendingReports}</h2>
                </div>
            </article>
            <article class="summary-card">
                <span class="summary-icon approved-icon">
                    <lightning-icon icon-name="utility:success" size="small">
                    </lightning-icon>
                </span>
                <div>
                    <p class="summary-label">Approved</p>
                    <h2>{approvedReports}</h2>
                </div>
            </article>
            <article class="summary-card">
                <span class="summary-icon amount-icon">
                    <lightning-icon icon-name="utility:currency" size="small">
                    </lightning-icon>
                </span>
                <div>
                    <p class="summary-label">Total Expenses</p>
                    <h2>{formattedGrandTotal}</h2>
                </div>
            </article>
        </section>

        <section class="filter-panel">
            <lightning-input
                type="search"
                label="Search reports"
                variant="label-hidden"
                placeholder="Search report number or destination..."
                value={searchTerm}
                onchange={handleSearchChange}>
            </lightning-input>
            <lightning-combobox
                label="Filter by status"
                variant="label-hidden"
                value={selectedStatus}
                options={statusFilterOptions}
                onchange={handleStatusChange}>
            </lightning-combobox>
        </section>

        <template lwc:if={isLoading}>
            <div class="loading-container">
                <lightning-spinner
                    alternative-text="Loading reports"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>
        <template lwc:else>
            <template lwc:if={hasReports}>
                <section class="reports-grid">
                    <template for:each={filteredReports} for:item="report">
                        <article key={report.Id} class={report.cardClass}>
                            <div class="report-card-header">
                                <div>
                                    <p class="report-number">{report.Name}</p>
                                    <h3>{report.destinationLabel}</h3>
                                </div>
                                <span class={report.statusClass}>
                                    {report.Status__c}
                                </span>
                            </div>

                            <div class="report-info">
                                <div class="info-row">
                                    <span>Report date</span>
                                    <strong>{report.formattedReportDate}</strong>
                                </div>
                                <div class="info-row">
                                    <span>Submission date</span>
                                    <strong>{report.formattedSubmissionDate}</strong>
                                </div>
                                <div class="info-row">
                                    <span>Total amount</span>
                                    <strong>{report.formattedTotal}</strong>
                                </div>
                            </div>

                            <div class="report-card-actions">
                                <lightning-button
                                    label="View Details"
                                    variant="neutral"
                                    data-id={report.Id}
                                    onclick={handleViewReport}>
                                </lightning-button>
                                <template lwc:if={report.isDraft}>
                                    <lightning-button
                                        label="Add Expense"
                                        variant="brand"
                                        data-id={report.Id}
                                        onclick={handleAddExpenseToReport}>
                                    </lightning-button>
                                </template>
                            </div>
                        </article>
                    </template>
                </section>
            </template>
            <template lwc:else>
                <div class="empty-state">
                    <lightning-icon
                        icon-name="utility:receipt"
                        size="large">
                    </lightning-icon>
                    <h2>No expense reports found</h2>
                    <p>Create a report to start recording your travel expenses.</p>
                    <lightning-button
                        label="Create Your First Report"
                        variant="brand"
                        onclick={handleOpenReportForm}>
                    </lightning-button>
                </div>
            </template>
        </template>

        <template lwc:if={showDetails}>
            <section class="details-panel">
                <div class="details-header">
                    <div>
                        <p class="eyebrow">REPORT DETAILS</p>
                        <h2>{selectedReport.Name}</h2>
                        <p>{selectedReport.destinationLabel}</p>
                    </div>
                    <div class="details-actions">
                        <template lwc:if={selectedReportIsDraft}>
                            <lightning-button
                                label="Add Expense"
                                variant="brand"
                                onclick={handleOpenExpenseForm}>
                            </lightning-button>
                        </template>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close details"
                            onclick={handleCloseDetails}>
                        </lightning-button-icon>
                    </div>
                </div>

                <div class="details-summary">
                    <div>
                        <span>Status</span>
                        <strong>{selectedReport.Status__c}</strong>
                    </div>
                    <div>
                        <span>Report date</span>
                        <strong>{selectedReport.formattedReportDate}</strong>
                    </div>
                    <div>
                        <span>Total amount</span>
                        <strong>{selectedReport.formattedTotal}</strong>
                    </div>
                </div>

                <template lwc:if={selectedReport.Rejection_Reason__c}>
                    <div class="rejection-message">
                        <strong>Rejection reason:</strong>
                        {selectedReport.Rejection_Reason__c}
                    </div>
                </template>

                <h3 class="section-title">Expense Items</h3>

                <template lwc:if={itemsLoading}>
                    <div class="loading-container">
                        <lightning-spinner
                            alternative-text="Loading expenses"
                            size="small">
                        </lightning-spinner>
                    </div>
                </template>
                <template lwc:elseif={itemsError}>
                    <div class="error-banner" role="alert">{itemsError}</div>
                </template>
                <template lwc:elseif={hasItems}>
                    <div class="table-wrapper">
                        <table class="expense-table">
                            <thead>
                                <tr>
                                    <th>Expense</th>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th>Payment</th>
                                    <th>Status</th>
                                    <th>Policy</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={expenseItems} for:item="item">
                                    <tr key={item.Id}>
                                        <td>
                                            <strong>{item.Name}</strong>
                                            <p class="table-description">
                                                {item.Description__c}
                                            </p>
                                        </td>
                                        <td>{item.formattedDate}</td>
                                        <td>{item.Category__c}</td>
                                        <td>{item.formattedAmount}</td>
                                        <td>{item.Payment_Method__c}</td>
                                        <td>
                                            <span class={item.statusClass}>
                                                {item.Status__c}
                                            </span>
                                        </td>
                                        <td>
                                            <span class={item.policyClass}>
                                                {item.Policy_Status__c}
                                            </span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else>
                    <div class="empty-state compact">
                        <p>No expense items have been added yet.</p>
                        <template lwc:if={selectedReportIsDraft}>
                            <lightning-button
                                label="Add First Expense"
                                variant="brand"
                                onclick={handleOpenExpenseForm}>
                            </lightning-button>
                        </template>
                    </div>
                </template>
            </section>
        </template>
    </div>

    <!-- Create report modal -->
    <template lwc:if={showReportForm}>
        <section class="modal-backdrop" onclick={handleReportBackdropClick}>
            <div
                class="expense-modal"
                data-report-form
                role="dialog"
                aria-modal="true"
                aria-labelledby="report-modal-title"
                onclick={handleModalContentClick}>

                <div class="modal-header">
                    <div>
                        <p class="eyebrow">NEW REPORT</p>
                        <h2 id="report-modal-title">Create Expense Report</h2>
                        <p>Create a new Draft report.</p>
                    </div>
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        onclick={handleCloseReportForm}
                        disabled={isCreatingReport}>
                    </lightning-button-icon>
                </div>

                <template lwc:if={reportFormError}>
                    <div class="form-error" role="alert">
                        {reportFormError}
                    </div>
                </template>

                <div class="modal-body">
                    <lightning-input
                        data-report-date
                        name="reportDate"
                        type="date"
                        label="Report Date"
                        value={newReportDate}
                        max={today}
                        required
                        disabled={isCreatingReport}
                        onchange={handleReportDateChange}>
                    </lightning-input>

                    <lightning-record-picker
                        label="Related Travel Request"
                        placeholder="Search travel requests..."
                        object-api-name="Travel_Request__c"
                        value={newTravelRequestId}
                        disabled={isCreatingReport}
                        onchange={handleTravelRequestChange}>
                    </lightning-record-picker>

                    <lightning-record-picker
                        label="Manager"
                        placeholder="Search users..."
                        object-api-name="User"
                        value={newManagerId}
                        disabled={isCreatingReport}
                        onchange={handleManagerChange}>
                    </lightning-record-picker>
                </div>

                <div class="modal-footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCloseReportForm}
                        disabled={isCreatingReport}>
                    </lightning-button>
                    <lightning-button
                        label="Create Draft Report"
                        variant="brand"
                        onclick={handleCreateReport}
                        disabled={isCreatingReport}>
                    </lightning-button>
                </div>

                <template lwc:if={isCreatingReport}>
                    <div class="modal-loading">
                        <lightning-spinner
                            alternative-text="Creating report"
                            size="small">
                        </lightning-spinner>
                    </div>
                </template>
            </div>
        </section>
    </template>

    <!-- Add expense modal -->
    <template lwc:if={showExpenseForm}>
        <section class="modal-backdrop" onclick={handleExpenseBackdropClick}>
            <div
                class="expense-modal"
                data-expense-form
                role="dialog"
                aria-modal="true"
                aria-labelledby="expense-modal-title"
                onclick={handleModalContentClick}>

                <div class="modal-header">
                    <div>
                        <p class="eyebrow">EXPENSE ITEM</p>
                        <h2 id="expense-modal-title">Add Expense</h2>
                    </div>
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        onclick={handleCloseExpenseForm}
                        disabled={isSaving}>
                    </lightning-button-icon>
                </div>

                <template lwc:if={formError}>
                    <div class="form-error" role="alert">{formError}</div>
                </template>

                <div class="modal-body">
                    <lightning-combobox
                        name="reportId"
                        label="Expense Report"
                        value={newExpense.reportId}
                        options={reportOptions}
                        placeholder="Select a Draft report"
                        required
                        disabled={isSaving}
                        onchange={handleExpenseFieldChange}>
                    </lightning-combobox>

                    <lightning-input
                        name="expenseDate"
                        type="date"
                        label="Expense Date"
                        value={newExpense.expenseDate}
                        max={today}
                        required
                        disabled={isSaving}
                        onchange={handleExpenseFieldChange}>
                    </lightning-input>

                    <lightning-combobox
                        name="category"
                        label="Category"
                        value={newExpense.category}
                        options={categoryOptions}
                        placeholder="Select category"
                        required
                        disabled={isSaving}
                        onchange={handleExpenseFieldChange}>
                    </lightning-combobox>

                    <lightning-input
                        name="amount"
                        type="number"
                        label="Amount (INR)"
                        value={newExpense.amount}
                        min="0.01"
                        step="0.01"
                        required
                        disabled={isSaving}
                        onchange={handleExpenseFieldChange}>
                    </lightning-input>

                    <lightning-input
                        name="description"
                        type="text"
                        label="Description"
                        value={newExpense.description}
                        maxlength="255"
                        disabled={isSaving}
                        onchange={handleExpenseFieldChange}>
                    </lightning-input>

                    <lightning-combobox
                        name="paymentMethod"
                        label="Payment Method"
                        value={newExpense.paymentMethod}
                        options={paymentMethodOptions}
                        placeholder="Select payment method"
                        required
                        disabled={isSaving}
                        onchange={handleExpenseFieldChange}>
                    </lightning-combobox>
                </div>

                <div class="modal-footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCloseExpenseForm}
                        disabled={isSaving}>
                    </lightning-button>
                    <lightning-button
                        label="Save Expense"
                        variant="brand"
                        onclick={handleSaveExpense}
                        disabled={isSaving}>
                    </lightning-button>
                </div>

                <template lwc:if={isSaving}>
                    <div class="modal-loading">
                        <lightning-spinner
                            alternative-text="Saving expense"
                            size="small">
                        </lightning-spinner>
                    </div>
                </template>
            </div>
        </section>
    </template>
</template>
