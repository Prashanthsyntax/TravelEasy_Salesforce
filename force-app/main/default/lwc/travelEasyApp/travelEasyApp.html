<template>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">T</div>
                <div>
                    <h1>TravelEasy</h1>
                    <p>Travel &amp; Expense</p>
                </div>
            </div>

            <!-- Navigation -->
            <div class="nav-section">
                <p class="nav-heading">WORKSPACE</p>

                <a class={dashboardNavClass} href="javascript:void(0)" onclick={handleDashboardClick}>
                    <span>▦</span>
                    Dashboard
                </a>

                <a class={travelRequestsNavClass} href="javascript:void(0)" onclick={handleTravelRequestsClick}>
                    <span>✈</span>
                    Travel Requests
                </a>

                <a class={itinerariesNavClass} href="javascript:void(0)" onclick={handleItinerariesClick}>
                    <span>▤</span>
                    Itineraries
                </a>

                <a class={expenseReportsNavClass} href="javascript:void(0)" onclick={handleExpenseReportsClick}>
                    <span>₹</span>
                    Expense Reports
                </a>

                <a class={expenseItemsNavClass} href="javascript:void(0)" onclick={handleExpenseItemsClick}>
                    <span>🧾</span>
                    Expense Items
                </a>

                <a class={reimbursementsNavClass} href="javascript:void(0)" onclick={handleReimbursementsClick}>
                    <span>₹</span>
                    Reimbursements
                </a>

                <a class="nav-item" href="javascript:void(0)">
                    <span>✓</span>
                    Approvals
                </a>
            </div>

            <!-- Sidebar Bottom -->
            <div class="sidebar-bottom">
                <div class="help-card">
                    <div class="help-icon">✦</div>
                    <h3>Need assistance?</h3>
                    <p>Your travel workspace, all in one place.</p>
                </div>

                <div class="profile">
                    <div class="avatar">{userInitial}</div>
                    <div>
                        <h4>{userName}</h4>
                        <p>{userRoleLabel}</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <div>
                    <p class="breadcrumb">
                        Workspace / {currentPageTitle}
                    </p>
                    <h2>{currentPageTitle}</h2>
                </div>

                <div class="topbar-right">
                    <span class="status-label">
                        <span class="status-dot"></span>
                        Salesforce Connected
                    </span>

                    <div class="avatar top-avatar">{userInitial}</div>
                </div>
            </header>

            <!-- Dashboard Page -->
            <template if:true={showDashboardPage}>
                <section class="welcome-section">
                    <div>
                        <p class="eyebrow">YOUR TRAVEL WORKSPACE</p>
                        <h2>{welcomeMessage} 👋</h2>
                        <p class="welcome-text">
                            Manage your journeys, expenses, and reimbursements
                            from one place.
                        </p>
                    </div>

                    <button class="primary-button" type="button" onclick={handleNewTravelRequest}>
                        + New Travel Request
                    </button>
                </section>

                <!-- Dashboard Statistics -->
                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon requests-icon">✈</div>
                        <p>Total Requests</p>
                        <h3>{totalRequests}</h3>
                        <span class="stat-caption">
                            Your travel requests
                        </span>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon approvals-icon">✓</div>
                        <p>Pending Approvals</p>
                        <h3>{pendingApprovals}</h3>
                        <span class="stat-caption">Awaiting review</span>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon expenses-icon">₹</div>
                        <p>Total Expenses</p>
                        <h3>
                            <lightning-formatted-number value={totalExpenses} format-style="currency"
                                currency-code="INR" maximum-fraction-digits="2"></lightning-formatted-number>
                        </h3>
                        <span class="stat-caption">Recorded expenses</span>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon reimbursement-icon">↻</div>
                        <p>Reimbursements</p>
                        <h3>
                            <lightning-formatted-number value={totalReimbursements} format-style="currency"
                                currency-code="INR" maximum-fraction-digits="2"></lightning-formatted-number>
                        </h3>
                        <span class="stat-caption">Approved amounts</span>
                    </div>
                </section>

                <!-- Dashboard Panels -->
                <section class="dashboard-grid">
                    <!-- Recent Requests -->
                    <div class="panel recent-panel">
                        <div class="panel-heading">
                            <div>
                                <h3>Recent Travel Requests</h3>
                                <p>Your latest travel activity</p>
                            </div>

                            <button class="text-button" type="button" onclick={handleTravelRequestsClick}>
                                View all
                            </button>
                        </div>

                        <template if:true={isLoading}>
                            <lightning-spinner alternative-text="Loading dashboard" size="small"></lightning-spinner>
                        </template>

                        <template if:true={hasError}>
                            <div class="empty-note">{errorMessage}</div>
                        </template>

                        <template if:true={hasRecentRequests}>
                            <div class="request-list">
                                <template for:each={recentRequests} for:item="request">
                                    <div class="request-row" key={request.Id}>
                                        <div class="request-icon">✈</div>

                                        <div class="request-details">
                                            <h4>{request.Destination__c}</h4>
                                            <p>{request.Purpose__c}</p>
                                            <span>{request.Name}</span>
                                        </div>

                                        <div class="request-meta">
                                            <span class="request-status">
                                                {request.Status__c}
                                            </span>
                                            <p>{request.From_Location__c}</p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template if:false={hasRecentRequests}>
                            <template if:false={isLoading}>
                                <div class="empty-note">
                                    No travel requests found for your account.
                                </div>
                            </template>
                        </template>
                    </div>

                    <!-- Quick Actions -->
                    <div class="panel quick-actions-panel">
                        <div class="panel-heading">
                            <div>
                                <h3>Quick Actions</h3>
                                <p>Get things done faster</p>
                            </div>
                        </div>

                        <button class="quick-action" type="button" onclick={handleNewTravelRequest}>
                            <span class="quick-action-icon">✈</span>
                            <span>
                                <strong>Request Travel</strong>
                                <small>Create a new travel request</small>
                            </span>
                            <span class="action-arrow">›</span>
                        </button>

                        <button class="quick-action" type="button" onclick={handleTravelRequestsClick}>
                            <span class="quick-action-icon">▤</span>
                            <span>
                                <strong>Travel Requests</strong>
                                <small>View your saved travel requests</small>
                            </span>
                            <span class="action-arrow">›</span>
                        </button>

                        <button class="quick-action" type="button" onclick={handleItinerariesClick}>
                            <span class="quick-action-icon">🧳</span>
                            <span>
                                <strong>Travel Itineraries</strong>
                                <small>View your trip and booking details</small>
                            </span>
                            <span class="action-arrow">›</span>
                        </button>

                        <button class="quick-action" type="button" onclick={handleExpenseReportsClick}>
                            <span class="quick-action-icon">₹</span>
                            <span>
                                <strong>Expense Reports</strong>
                                <small>Track expenses and report status</small>
                            </span>
                            <span class="action-arrow">›</span>
                        </button>
                    </div>
                </section>
            </template>

            <!-- Travel Requests Page -->
            <template if:true={showTravelRequestsPage}>
                <section class="travel-requests-page">
                    <section class="welcome-section">
                        <div>
                            <p class="eyebrow">TRAVEL MANAGEMENT</p>
                            <h2>Travel Requests</h2>
                            <p class="welcome-text">
                                Create and manage your business travel requests.
                            </p>
                        </div>

                        <button class="primary-button" type="button" onclick={handleNewTravelRequest}>
                            + New Travel Request
                        </button>
                    </section>

                    <!-- New Travel Request Flow -->
                    <div class="panel travel-request-panel">
                        <div class="panel-heading">
                            <div>
                                <h3>New Travel Request</h3>
                                <p>
                                    Enter your trip details using the form below.
                                </p>
                            </div>
                        </div>

                        <template if:true={showTravelRequestFlow}>
                            <div class="flow-container">
                                <lightning-flow flow-api-name="TravelEasy_Travel_Request"
                                    onstatuschange={handleFlowStatusChange}></lightning-flow>
                            </div>
                        </template>

                        <template if:false={showTravelRequestFlow}>
                            <div class="travel-request-empty">
                                <div class="large-travel-icon">✈</div>
                                <h3>Plan your next business trip</h3>
                                <p>
                                    Start a request by entering your destination,
                                    dates, purpose, and estimated cost.
                                </p>

                                <button class="primary-button" type="button" onclick={handleNewTravelRequest}>
                                    Start Request
                                </button>
                            </div>
                        </template>
                    </div>

                    <!-- My Travel Requests -->
                    <div class="panel travel-request-panel">
                        <div class="panel-heading">
                            <div>
                                <h3>My Travel Requests</h3>
                                <p>Your saved travel requests</p>
                            </div>

                            <button class="text-button" type="button" onclick={handleRefreshRequests}
                                disabled={isRequestsLoading}>
                                Refresh
                            </button>
                        </div>

                        <template if:true={isRequestsLoading}>
                            <lightning-spinner alternative-text="Loading travel requests"
                                size="medium"></lightning-spinner>
                        </template>

                        <template if:true={requestsError}>
                            <div class="empty-note">{requestsError}</div>
                        </template>

                        <template if:false={isRequestsLoading}>
                            <template if:false={requestsError}>
                                <template if:true={hasTravelRequests}>
                                    <div class="table-responsive">
                                        <table class="travel-requests-table">
                                            <thead>
                                                <tr>
                                                    <th>Request ID</th>
                                                    <th>Destination</th>
                                                    <th>From</th>
                                                    <th>Start Date</th>
                                                    <th>End Date</th>
                                                    <th>Estimated Cost</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>

                                            <tbody>
                                                <template for:each={travelRequests} for:item="request">
                                                    <tr key={request.Id}>
                                                        <td>{request.Name}</td>
                                                        <td>{request.Destination__c}</td>
                                                        <td>{request.From_Location__c}</td>
                                                        <td>
                                                            <lightning-formatted-date-time value={request.Start_Date__c}
                                                                year="numeric" month="short"
                                                                day="2-digit"></lightning-formatted-date-time>
                                                        </td>
                                                        <td>
                                                            <lightning-formatted-date-time value={request.End_Date__c}
                                                                year="numeric" month="short"
                                                                day="2-digit"></lightning-formatted-date-time>
                                                        </td>
                                                        <td>
                                                            <lightning-formatted-number
                                                                value={request.Estimated_Cost__c}
                                                                format-style="currency" currency-code="INR"
                                                                maximum-fraction-digits="2"></lightning-formatted-number>
                                                        </td>
                                                        <td>
                                                            <span class="request-status">
                                                                {request.Status__c}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>

                                <template if:false={hasTravelRequests}>
                                    <div class="empty-note">
                                        No travel requests found. Create your
                                        first request above.
                                    </div>
                                </template>
                            </template>
                        </template>
                    </div>
                </section>
            </template>

            <!-- Travel Itineraries Page -->
            <template if:true={showItinerariesPage}>
                <section class="itineraries-page">
                    <c-travel-easy-itinerary></c-travel-easy-itinerary>
                </section>
            </template>

            <!-- Expense Reports Page -->
            <template if:true={showExpenseReportsPage}>
                <section class="expense-reports-page">
                    <c-travel-easy-expense-reports></c-travel-easy-expense-reports>
                </section>
            </template>

            <!-- Expense Items Page -->
            <template if:true={showExpenseItemsPage}>
                <section class="expense-items-page">
                    <c-travel-easy-expense-items></c-travel-easy-expense-items>
                </section>
            </template>


            <!-- Reimbursements Page -->
            <template if:true={showReimbursementsPage}>
                <section class="reimbursements-page">
                    <c-travel-easy-reimbursements></c-travel-easy-reimbursements>
                </section>
            </template>


            <!-- Footer -->
            <footer class="footer">
                TravelEasy · Travel and expense management
            </footer>
        </main>
    </div>
</template>
